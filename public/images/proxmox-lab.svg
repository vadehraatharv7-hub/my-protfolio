<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#08142b" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <filter id="green-glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg3)" />

  <!-- Proxmox Node Cluster Diagram -->
  <g transform="translate(600, 320)">
    <!-- Node Cluster Rack -->
    <rect x="-240" y="-120" width="480" height="240" rx="8" fill="#080e1e" stroke="#00ff66" stroke-width="2" filter="url(#green-glow)" opacity="0.8"/>
    
    <!-- Rack Server 1 (OPNSense FW) -->
    <rect x="-210" y="-95" width="420" height="50" rx="4" fill="#0c1933" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="-180" cy="-70" r="5" fill="#00ff66" />
    <text x="-160" y="-65" font-family="monospace" font-size="14" fill="#ffffff">NODE 01: OPNSense Firewall &amp; WireGuard Gateway</text>
    <text x="180" y="-65" font-family="monospace" font-size="12" fill="#00ff66">VLAN 10</text>

    <!-- Rack Server 2 (Wazuh SIEM) -->
    <rect x="-210" y="-30" width="420" height="50" rx="4" fill="#0c1933" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="-180" cy="-5" r="5" fill="#00f0ff" />
    <text x="-160" y="0" font-family="monospace" font-size="14" fill="#ffffff">NODE 02: Wazuh SIEM &amp; Threat Intelligence Cluster</text>
    <text x="180" y="0" font-family="monospace" font-size="12" fill="#00f0ff">VLAN 20</text>

    <!-- Rack Server 3 (Sandbox Honeypots) -->
    <rect x="-210" y="35" width="420" height="50" rx="4" fill="#0c1933" stroke="#ff0055" stroke-width="1.5" />
    <circle cx="-180" cy="60" r="5" fill="#ff0055" />
    <text x="-160" y="65" font-family="monospace" font-size="14" fill="#ffffff">NODE 03: Cowrie / Dionaea Dynamic Honeypot Pool</text>
    <text x="180" y="65" font-family="monospace" font-size="12" fill="#ff0055">DMZ</text>
  </g>

  <text x="70" y="80" font-family="monospace" font-size="18" fill="#00ff66" letter-spacing="4">[ AIR-GAPPED LAB // PROXMOX VE ]</text>
  <text x="70" y="120" font-family="monospace" font-size="36" font-weight="bold" fill="#ffffff">HARDENED HOMELAB &amp; TERRAFORM IaC</text>
  <text x="70" y="155" font-family="monospace" font-size="16" fill="#94a3b8">ISOLATED ENTERPRISE SIMULATION &amp; AUTOMATED ROLLBACK TRIGGERS</text>

  <text x="70" y="585" font-family="monospace" font-size="14" fill="#00ff66">HYPERVISOR: PVE 8.2 // ZFS RAID-10 // CEPH STORAGE</text>
  <text x="1130" y="585" font-family="monospace" font-size="14" fill="#00f0ff" text-anchor="end">AUTOMATION: TERRAFORM BPG PROVIDER</text>
</svg>
