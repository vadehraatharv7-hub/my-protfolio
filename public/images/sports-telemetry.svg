<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#0c1833" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>
    <filter id="cyan-glow4">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg4)" />

  <!-- Data Flow Architecture -->
  <g transform="translate(600, 315)">
    <!-- Stream Ingestion node -->
    <circle cx="-350" cy="0" r="35" fill="#08142a" stroke="#00f0ff" stroke-width="2" filter="url(#cyan-glow4)" />
    <text x="-350" y="5" font-family="monospace" font-size="12" fill="#ffffff" text-anchor="middle">KINESIS</text>

    <!-- Arrow 1 -->
    <line x1="-315" y1="0" x2="-195" y2="0" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6,4" />

    <!-- Processing Engine -->
    <rect x="-195" y="-50" width="120" height="100" rx="6" fill="#08142a" stroke="#00ff66" stroke-width="2" />
    <text x="-135" y="-10" font-family="monospace" font-size="12" fill="#00ff66" text-anchor="middle">FASTAPI</text>
    <text x="-135" y="15" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">ECS / FARGATE</text>

    <!-- Arrow 2 -->
    <line x1="-75" y1="0" x2="45" y2="0" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6,4" />

    <!-- Analytical Model -->
    <rect x="45" y="-50" width="130" height="100" rx="6" fill="#08142a" stroke="#00f0ff" stroke-width="2" filter="url(#cyan-glow4)" />
    <text x="110" y="-10" font-family="monospace" font-size="12" fill="#ffffff" text-anchor="middle">PYTORCH / ML</text>
    <text x="110" y="15" font-family="monospace" font-size="11" fill="#00f0ff" text-anchor="middle">TELEMETRY</text>

    <!-- Arrow 3 -->
    <line x1="175" y1="0" x2="295" y2="0" stroke="#00ff66" stroke-width="2" />

    <!-- Real-time Dashboard -->
    <circle cx="340" cy="0" r="45" fill="#08142a" stroke="#00ff66" stroke-width="2" />
    <text x="340" y="5" font-family="monospace" font-size="12" fill="#00ff66" text-anchor="middle">WEBSOCKET</text>
  </g>

  <text x="70" y="80" font-family="monospace" font-size="18" fill="#00f0ff" letter-spacing="4">[ CLOUD_ENGINEERING // HIGH-THROUGHPUT PIPELINES ]</text>
  <text x="70" y="120" font-family="monospace" font-size="36" font-weight="bold" fill="#ffffff">REAL-TIME SPORTS ANALYTICS &amp; TELEMETRY</text>
  <text x="70" y="155" font-family="monospace" font-size="16" fill="#94a3b8">DISTRIBUTED CLOUD STREAMING ENGINE ON AWS ECS &amp; FASTAPI</text>

  <text x="70" y="585" font-family="monospace" font-size="14" fill="#00ff66">THROUGHPUT: 85,000 EVENTS/SEC // P99 LATENCY: 12ms</text>
  <text x="1130" y="585" font-family="monospace" font-size="14" fill="#00f0ff" text-anchor="end">TERRAFORM MANAGED INFRASTRUCTURE</text>
</svg>
